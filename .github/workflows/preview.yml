# Plan morning-digest § 3/§ 4: save /digest/2026-10-28 as one HTML file and publish it on
# GitHub Pages. The page is built here, never committed (ADR 0003: no previews in the repo).
# LANE_MARKER comes from the repo secret of the same name; with the secret deleted, the banner
# reads "no marker set" (§ 4 clean-up). Run: gh workflow run preview.yml
name: preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y pnpm@10 install --frozen-lockfile
      - name: save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          PORT: 8787
        run: |
          npx tsx src/server.ts > /tmp/rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf localhost:8787/digest/2026-10-28 -o _site/index.html
          grep -c '<table>' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
